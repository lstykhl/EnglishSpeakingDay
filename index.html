<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>English Speaking Day</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap');

    :root {
      --dp-color-ground: #f5f4ee;
      --dp-color-ink: #000000;
      --dp-color-accent: #ff0000;
      --dp-color-field: #0000ff;
      --dp-color-field-support: #facc15;
      --dp-color-quiet: #e8e8e8;
      --dp-color-on-field: #ffffff;
      --dp-typography-face: "Space Grotesk", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--dp-color-ground);
      color: var(--dp-color-ink);
      font-family: var(--dp-typography-face);
      line-height: 1.5;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      min-height: 100vh;
      border: 4px solid var(--dp-color-ink);
    }

    .plane-main {
      flex: 1 1 65%;
      padding: clamp(22px, 4.45cqi, 72px);
      border-right: 4px solid var(--dp-color-ink);
    }

    .plane-action {
      flex: 1 1 35%;
      background-color: var(--dp-color-accent);
      padding: clamp(22px, 4.45cqi, 72px);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    h1, h2, h3 { font-weight: 800; text-transform: uppercase; letter-spacing: -0.02em; }
    h1 { font-size: 2.8rem; line-height: 1; }
    h2 { font-size: 1.6rem; background: var(--dp-color-field-support); display: inline-block; padding: 4px 12px; border: 4px solid var(--dp-color-ink); margin-bottom: 1rem; }

    /* Grand Total Banner */
    .grand-banner {
      background: var(--dp-color-ink);
      color: var(--dp-color-ground);
      padding: 16px 24px;
      border: 4px solid var(--dp-color-ink);
      margin: 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .grand-number {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--dp-color-field-support);
    }

    .grid-rules {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 0;
      border: 4px solid var(--dp-color-ink);
      background: var(--dp-color-ink);
    }
    
    .grid-cell {
      background: var(--dp-color-ground);
      padding: 1.5rem;
      border: 2px solid var(--dp-color-ink);
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--dp-color-ink);
      padding: 10px 8px;
      font-size: 1rem;
      font-weight: 600;
    }

    /* Podium Styles */
    .podium-1 { background: #facc15; font-size: 1.15rem; font-weight: 800; border: 3px solid var(--dp-color-ink); margin-bottom: 4px; }
    .podium-2 { background: #e2e8f0; font-weight: 700; border: 3px solid var(--dp-color-ink); margin-bottom: 4px; }
    .podium-3 { background: #fdba74; font-weight: 700; border: 3px solid var(--dp-color-ink); margin-bottom: 4px; }

    .house-bar-container { width: 100%; border: 3px solid var(--dp-color-ink); height: 28px; margin-top: 6px; background: var(--dp-color-ground); }
    .house-bar { height: 100%; transition: width 0.5s ease; }
    
    .bg-Red { background-color: #ef4444; }
    .bg-Purple { background-color: #a855f7; }
    .bg-Yellow { background-color: #facc15; }
    .bg-Green { background-color: #10b981; }

    /* Camera Ready Indicator */
    .scanner-wrapper { position: relative; width: 100%; }
    .camera-ready-bar {
      position: absolute; top: 0; left: 0; right: 0;
      background: #10b981; color: white; text-align: center; font-weight: 800;
      padding: 6px; border-bottom: 3px solid var(--dp-color-ink); z-index: 10;
      display: none; animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }

    /* Teacher Actions */
    .action-circle {
      background: var(--dp-color-ground);
      color: var(--dp-color-ink);
      border: 4px solid var(--dp-color-ink);
      border-radius: 50%;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 6px 6px 0px var(--dp-color-ink);
      transition: all 0.1s;
      align-self: center;
      margin: 16px 0;
    }
    .action-circle:active { box-shadow: 0px 0px 0px var(--dp-color-ink); transform: translate(6px, 6px); }

    .input-rect {
      background: var(--dp-color-field);
      color: var(--dp-color-on-field);
      border: 4px solid var(--dp-color-ink);
      padding: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      width: 100%;
      outline: none;
    }
    .input-rect::placeholder { color: rgba(255,255,255,0.7); }

    #reader { border: 4px solid var(--dp-color-ink); background: var(--dp-color-ink); width: 100%; }

    .status-panel {
      padding: 16px; border: 4px solid var(--dp-color-ink); font-weight: 700; display: none; margin-top: 16px;
    }
    .status-success { background: #10b981; color: #fff; }
    .status-warn { background: #facc15; color: #000; }
    .status-error { background: var(--dp-color-ink); color: #fff; }

    .controls-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    select, input[type="date"] {
      padding: 8px; border: 3px solid var(--dp-color-ink); font-family: inherit; font-weight: 600; flex: 1; min-width: 130px;
    }
    .btn-square {
      background: var(--dp-color-field); color: white; border: 3px solid var(--dp-color-ink); padding: 8px 16px; cursor: pointer; font-weight: 700;
    }

    @media (max-width: 720px) {
      .plane-main { border-right: none; border-bottom: 4px solid var(--dp-color-ink); }
      .container { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- LEADERBOARD PLANE -->
  <div class="plane-main">
    <h1>English Speaking Day</h1>

    <!-- Grand Total Banner -->
    <div class="grand-banner">
      <div>
        <div style="font-size:0.9rem; font-weight:700; text-transform:uppercase; letter-spacing:1px;">Total Speaking Interactions</div>
        <div style="font-size:0.8rem; opacity:0.8;">Campus-Wide Conversations</div>
      </div>
      <div id="grandTotal" class="grand-number">0</div>
    </div>
    
    <div class="controls-row">
      <select id="presetRange" onchange="applyPreset()">
        <option value="all">All-Time Standing</option>
        <option value="today">Today's Live</option>
        <option value="thisWeek">This Week</option>
      </select>
      <input type="date" id="startDate" onchange="refreshLeaderboard()">
      <input type="date" id="endDate" onchange="refreshLeaderboard()">
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="liveRefresh" checked> <b>Live Broadcast</b>
      </div>
    </div>

    <div class="grid-rules">
      <div class="grid-cell">
        <h2>Star Student Speakers</h2>
        <div id="studentList">Loading...</div>
      </div>
      <div class="grid-cell">
        <h2>House Ranking</h2>
        <div id="houseList">Loading...</div>
        
        <h2 style="margin-top:2rem;">Top English Groups</h2>
        <div id="groupList">Loading...</div>

        <h2 style="margin-top:2rem;">Outstanding Classes</h2>
        <div id="classList">Loading...</div>
      </div>
    </div>
  </div>

  <!-- TEACHER ACTION PLANE -->
  <div class="plane-action" id="teacherPanel" style="display:none;">
    <h2 style="background:var(--dp-color-ground); color:var(--dp-color-ink);">Teacher Terminal</h2>
    
    <div class="scanner-wrapper">
      <div id="readyBar" class="camera-ready-bar">READY FOR NEXT CARD...</div>
      <div id="reader"></div>
    </div>
    
    <button class="action-circle" id="scanBtn" onclick="toggleScanner()">Start Scan</button>
    
    <div>
      <input type="text" id="manualId" class="input-rect" placeholder="Manual ID Entry" onkeypress="if(event.key==='Enter') submitManual()">
    </div>

    <div id="statusBox" class="status-panel"></div>

    <div style="background:var(--dp-color-ground); padding:16px; border:4px solid var(--dp-color-ink); margin-top:16px;">
      <h3>Class & Group Lookup</h3>
      <div class="controls-row" style="margin-top:8px;">
        <select id="lookupType">
          <option value="class">Class</option>
          <option value="group">Eng Group</option>
        </select>
        <select id="lookupValue"></select>
        <button class="btn-square" onclick="lookupScores()">Search</button>
      </div>
      <div id="lookupResults" style="max-height:200px; overflow-y:auto; border:2px solid black; padding:8px; display:none;"></div>
    </div>
  </div>
</div>

<script>
  let html5QrcodeScanner = null;
  const houseNames = {
    'Red': 'Red 仁',
    'Purple': 'Purple 愛',
    'Yellow': 'Yellow 勤',
    'Green': 'Green 誠'
  };

  const beepSuccess = new Audio('https://actions.google.com/sounds/v1/ui/probes_tone.ogg');
  const beepError = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

  window.onload = () => {
    google.script.run.withSuccessHandler(initApp).getInitialData();
    setInterval(() => {
      if (document.getElementById('liveRefresh').checked) refreshLeaderboard();
    }, 12000);
  };

  function initApp(data) {
    if (data.isTeacher) {
      document.getElementById('teacherPanel').style.display = 'flex';
      google.script.run.withSuccessHandler(populateOptions).getClassAndGroupOptions();
    }
    renderLeaderboards(data.leaderboard);
  }

  function toggleScanner() {
    if (html5QrcodeScanner) {
      html5QrcodeScanner.clear();
      html5QrcodeScanner = null;
      document.getElementById('scanBtn').innerText = "START SCAN";
      document.getElementById('readyBar').style.display = "none";
    } else {
      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 100 } },
        (decodedText) => { processScore(decodedText); },
        (error) => { /* ignore scan frame errors */ }
      );
      document.getElementById('scanBtn').innerText = "STOP SCAN";
      document.getElementById('readyBar').style.display = "block";
    }
  }

  function submitManual() {
    const val = document.getElementById('manualId').value;
    if (val) processScore(val);
    document.getElementById('manualId').value = "";
    document.getElementById('manualId').blur();
  }

  let isProcessing = false;
  function processScore(studentId) {
    if (isProcessing) return;
    isProcessing = true;
    document.getElementById('readyBar').style.display = "none";
    showStatus('Processing...', 'status-warn');
    
    google.script.run
      .withSuccessHandler(res => {
        isProcessing = false;
        if (res.success) {
          beepSuccess.play();
          showStatus(`+1 Point!<br>${res.student.name} (${res.student.className})<br>Total Score: ${res.student.totalScore}`, 'status-success');
        } else if (res.cooldown) {
          beepError.play();
          showStatus(res.message, 'status-warn');
        } else {
          beepError.play();
          showStatus(res.message, 'status-error');
        }
        setTimeout(() => {
          if (html5QrcodeScanner) document.getElementById('readyBar').style.display = "block";
        }, 2500);
      })
      .withFailureHandler(err => {
        isProcessing = false;
        beepError.play();
        showStatus('Network Error.', 'status-error');
        setTimeout(() => {
          if (html5QrcodeScanner) document.getElementById('readyBar').style.display = "block";
        }, 2500);
      })
      .recordPoint(studentId);
  }

  function showStatus(html, className) {
    const box = document.getElementById('statusBox');
    box.className = `status-panel ${className}`;
    box.innerHTML = html;
    box.style.display = 'block';
    setTimeout(() => { box.style.display = 'none'; }, 3000);
  }

  function applyPreset() {
    const val = document.getElementById('presetRange').value;
    const now = new Date();
    
    if (val === 'today') {
      const today = now.toISOString().split('T')[0];
      document.getElementById('startDate').value = today;
      document.getElementById('endDate').value = today;
    } else if (val === 'thisWeek') {
      const day = now.getDay() || 7;
      const monday = new Date(now);
      monday.setDate(now.getDate() - day + 1);
      const sunday = new Date(now);
      sunday.setDate(now.getDate() - day + 7);
      
      document.getElementById('startDate').value = monday.toISOString().split('T')[0];
      document.getElementById('endDate').value = sunday.toISOString().split('T')[0];
    } else {
      document.getElementById('startDate').value = "";
      document.getElementById('endDate').value = "";
    }
    refreshLeaderboard();
  }

  function refreshLeaderboard() {
    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;
    google.script.run.withSuccessHandler(renderLeaderboards).calculateLeaderboard(start, end);
  }

  function renderLeaderboards(data) {
    document.getElementById('grandTotal').innerText = data.totalInteractions || 0;

    const icons = ['🥇', '🥈', '🥉'];
    document.getElementById('studentList').innerHTML = data.students.map((s, i) => `
      <div class="stat-row ${i===0?'podium-1':(i===1?'podium-2':(i===2?'podium-3':''))}">
        <span>${i<3?icons[i]:'#'+(i+1)} ${s.name} (${s.className})</span>
        <span>${s.score} pt</span>
      </div>`).join('') || '<div style="padding:12px 0;">No speaking logs found.</div>';

    const maxHouse = Math.max(...data.houses.map(h => h.score), 1);
    document.getElementById('houseList').innerHTML = data.houses.map((h, i) => `
      <div style="margin-bottom:12px;">
        <div style="display:flex; justify-content:space-between; font-weight:700;">
          <span>#${i+1} ${houseNames[h.name] || h.name}</span>
          <span>${h.score} pt</span>
        </div>
        <div class="house-bar-container">
          <div class="house-bar bg-${h.name}" style="width:${(h.score/maxHouse)*100}%;"></div>
        </div>
      </div>`).join('');

    document.getElementById('groupList').innerHTML = data.groups.map((g, i) => `<div class="stat-row"><span>#${i+1} ${g.name}</span><span>${g.score}</span></div>`).join('') || '<div style="padding:8px 0;">-</div>';
    document.getElementById('classList').innerHTML = data.classes.map((c, i) => `<div class="stat-row"><span>#${i+1} ${c.name}</span><span>${c.score}</span></div>`).join('') || '<div style="padding:8px 0;">-</div>';
  }

  function populateOptions(opts) {
    window.dropdownOpts = opts;
    updateLookupDropdown();
    document.getElementById('lookupType').addEventListener('change', updateLookupDropdown);
  }
  
  function updateLookupDropdown() {
    const type = document.getElementById('lookupType').value;
    const arr = type === 'class' ? window.dropdownOpts.classes : window.dropdownOpts.groups;
    document.getElementById('lookupValue').innerHTML = arr.map(a => `<option value="${a}">${a}</option>`).join('');
  }

  function lookupScores() {
    const type = document.getElementById('lookupType').value;
    const val = document.getElementById('lookupValue').value;
    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;
    
    document.getElementById('lookupResults').innerHTML = 'Loading...';
    document.getElementById('lookupResults').style.display = 'block';

    google.script.run.withSuccessHandler(res => {
      if (!res || res.length === 0) {
        document.getElementById('lookupResults').innerHTML = 'No students found.';
        return;
      }
      document.getElementById('lookupResults').innerHTML = res.map(r => `
        <div style="display:flex; justify-content:space-between; border-bottom:1px solid #000; padding:4px 0; font-size:0.9rem;">
          <span>${r.classNo ? r.classNo + '. ' : ''}${r.name}</span><strong>${r.score} pt</strong>
        </div>
      `).join('');
    }).getStudentScoresByFilter(type, val, start, end);
  }
</script>
</body>
</html>
