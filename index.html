<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>English Speaking Day</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');

    :root {
      --dp-color-ground: #f5f4ee;
      --dp-color-ink: #000000;
      --dp-color-accent: #ff0000;
      --dp-color-field: #0000ff;
      --dp-color-field-support: #ffff00;
      --dp-color-quiet: #e8e8e8;
      --dp-color-on-field: #ffffff;
      --dp-typography-face: "Space Grotesk", "Bauhaus Host", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--dp-color-ground);
      color: var(--dp-color-ink);
      font-family: var(--dp-typography-face);
      line-height: 1.5;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      min-height: 100vh;
      border: 4px solid var(--dp-color-ink);
    }

    .plane-main {
      flex: 1 1 65%;
      padding: clamp(22px, 4.45cqi, 72px);
      border-right: 4px solid var(--dp-color-ink);
    }

    .plane-action {
      flex: 1 1 35%;
      background-color: var(--dp-color-accent);
      padding: clamp(22px, 4.45cqi, 72px);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    h1, h2, h3 { font-weight: 800; text-transform: uppercase; letter-spacing: -0.02em; }
    h1 { font-size: 3rem; margin-bottom: 2rem; line-height: 1; }
    h2 { font-size: 2rem; background: var(--dp-color-field-support); display: inline-block; padding: 4px 12px; border: 4px solid var(--dp-color-ink); margin-bottom: 1.5rem; }

    .grid-rules {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 0;
      border: 4px solid var(--dp-color-ink);
      background: var(--dp-color-ink);
    }
    
    .grid-cell {
      background: var(--dp-color-ground);
      padding: 1.5rem;
      border: 2px solid var(--dp-color-ink);
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 3px solid var(--dp-color-ink);
      padding: 12px 0;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .podium-1 { background: var(--dp-color-field-support); padding: 8px; border: 3px solid var(--dp-color-ink); font-size: 1.3rem; }
    .podium-2 { background: var(--dp-color-quiet); padding: 8px; border: 3px solid var(--dp-color-ink); }

    .house-bar-container { width: 100%; border: 3px solid var(--dp-color-ink); height: 30px; margin-top: 8px; background: var(--dp-color-ground); }
    .house-bar { height: 100%; transition: width 0.5s ease; }
    
    .bg-Red { background-color: #ff0000; }
    .bg-Purple { background-color: #a855f7; }
    .bg-Yellow { background-color: #facc15; }
    .bg-Green { background-color: #10b981; }

    /* Teacher Actions */
    .action-circle {
      background: var(--dp-color-ground);
      color: var(--dp-color-ink);
      border: 4px solid var(--dp-color-ink);
      border-radius: 50%;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 750;
      font-size: 1.2rem;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 6px 6px 0px var(--dp-color-ink);
      transition: all 0.1s;
      align-self: center;
      margin: 20px 0;
    }
    .action-circle:active { box-shadow: 0px 0px 0px var(--dp-color-ink); transform: translate(6px, 6px); }

    .input-rect {
      background: var(--dp-color-field);
      color: var(--dp-color-on-field);
      border: 4px solid var(--dp-color-ink);
      padding: 16px;
      font-size: 1.2rem;
      font-weight: 700;
      width: 100%;
      outline: none;
    }
    .input-rect::placeholder { color: rgba(255,255,255,0.7); }

    #reader { border: 4px solid var(--dp-color-ink); background: var(--dp-color-ink); width: 100%; }

    .status-panel {
      padding: 16px; border: 4px solid var(--dp-color-ink); font-weight: 700; display: none; margin-top: 16px;
    }
    .status-success { background: #10b981; color: #fff; }
    .status-warn { background: #facc15; color: #000; }
    .status-error { background: var(--dp-color-ink); color: #fff; }

    .controls-row { display: flex; gap: 8px; margin-bottom: 24px; }
    select, input[type="date"] {
      padding: 8px; border: 3px solid var(--dp-color-ink); font-family: inherit; font-weight: 600; flex: 1;
    }
    .btn-square {
      background: var(--dp-color-field); color: white; border: 3px solid var(--dp-color-ink); padding: 8px 16px; cursor: pointer; font-weight: 700;
    }

    @media (max-width: 720px) {
      .plane-main { border-right: none; border-bottom: 4px solid var(--dp-color-ink); }
      .container { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- LEADERBOARD PLANE -->
  <div class="plane-main">
    <h1>English Speaking Day</h1>
    
    <div class="controls-row">
      <select id="presetRange" onchange="applyPreset()">
        <option value="all">All-Time Standing</option>
        <option value="today">Today's Live</option>
      </select>
      <input type="date" id="startDate" onchange="refreshLeaderboard()">
      <input type="date" id="endDate" onchange="refreshLeaderboard()">
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="liveRefresh" checked> <b>Live Refresh</b>
      </div>
    </div>

    <div class="grid-rules">
      <div class="grid-cell">
        <h2>Top 10 Stars</h2>
        <div id="studentList">Loading...</div>
      </div>
      <div class="grid-cell">
        <h2>House Ranking</h2>
        <div id="houseList">Loading...</div>
        
        <h2 style="margin-top:2rem;">Top 5 Groups</h2>
        <div id="groupList">Loading...</div>

        <h2 style="margin-top:2rem;">Top 5 Classes</h2>
        <div id="classList">Loading...</div>
      </div>
    </div>
  </div>

  <!-- TEACHER ACTION PLANE -->
  <div class="plane-action" id="teacherPanel" style="display:none;">
    <h2 style="background:var(--dp-color-ground); color:var(--dp-color-ink);">Teacher Terminal</h2>
    
    <div id="reader"></div>
    <button class="action-circle" id="scanBtn" onclick="toggleScanner()">Scan ID</button>
    
    <div>
      <input type="text" id="manualId" class="input-rect" placeholder="Manual ID Entry" onkeypress="if(event.key==='Enter') submitManual()">
    </div>

    <div id="statusBox" class="status-panel"></div>

    <div style="background:var(--dp-color-ground); padding:16px; border:4px solid var(--dp-color-ink); margin-top:24px;">
      <h3>Lookup Roster</h3>
      <div class="controls-row" style="margin-top:8px;">
        <select id="lookupType">
          <option value="class">Class</option>
          <option value="group">Eng Group</option>
        </select>
        <select id="lookupValue"></select>
        <button class="btn-square" onclick="lookupScores()">Search</button>
      </div>
      <div id="lookupResults" style="max-height:200px; overflow-y:auto; border:2px solid black; padding:8px; display:none;"></div>
    </div>
  </div>
</div>

<script>
  let html5QrcodeScanner = null;
  const beepSuccess = new Audio('https://actions.google.com/sounds/v1/ui/probes_tone.ogg');
  const beepError = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

  // Initialize Data
  window.onload = () => {
    google.script.run.withSuccessHandler(initApp).getInitialData();
    setInterval(() => {
      if (document.getElementById('liveRefresh').checked) refreshLeaderboard();
    }, 15000);
  };

  function initApp(data) {
    if (data.isTeacher) {
      document.getElementById('teacherPanel').style.display = 'flex';
      google.script.run.withSuccessHandler(populateOptions).getClassAndGroupOptions();
    }
    renderLeaderboards(data.leaderboard);
  }

  // Scanner Logic
  function toggleScanner() {
    if (html5QrcodeScanner) {
      html5QrcodeScanner.clear();
      html5QrcodeScanner = null;
      document.getElementById('scanBtn').innerText = "SCAN ID";
    } else {
      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 100 } },
        (decodedText) => { processScore(decodedText); },
        (error) => { /* ignore frame errors */ }
      );
      document.getElementById('scanBtn').innerText = "STOP";
    }
  }

  function submitManual() {
    const val = document.getElementById('manualId').value;
    if (val) processScore(val);
    document.getElementById('manualId').value = "";
    document.getElementById('manualId').blur();
  }

  let isProcessing = false;
  function processScore(studentId) {
    if (isProcessing) return;
    isProcessing = true;
    showStatus('Processing...', 'status-warn');
    
    google.script.run
      .withSuccessHandler(res => {
        isProcessing = false;
        if (res.success) {
          beepSuccess.play();
          showStatus(`+1 Point!<br>${res.student.name} (${res.student.className})<br>Total: ${res.student.totalScore}`, 'status-success');
        } else if (res.cooldown) {
          beepError.play();
          showStatus(res.message, 'status-warn');
        } else {
          beepError.play();
          showStatus(res.message, 'status-error');
        }
      })
      .withFailureHandler(err => {
        isProcessing = false;
        beepError.play();
        showStatus('Network Error.', 'status-error');
      })
      .recordPoint(studentId);
  }

  function showStatus(html, className) {
    const box = document.getElementById('statusBox');
    box.className = `status-panel ${className}`;
    box.innerHTML = html;
    box.style.display = 'block';
    setTimeout(() => { box.style.display = 'none'; }, 4000);
  }

  // Leaderboard Logic
  function applyPreset() {
    const val = document.getElementById('presetRange').value;
    const today = new Date().toISOString().split('T')[0];
    if (val === 'today') {
      document.getElementById('startDate').value = today;
      document.getElementById('endDate').value = today;
    } else {
      document.getElementById('startDate').value = "";
      document.getElementById('endDate').value = "";
    }
    refreshLeaderboard();
  }

  function refreshLeaderboard() {
    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;
    google.script.run.withSuccessHandler(renderLeaderboards).calculateLeaderboard(start, end);
  }

  function renderLeaderboards(data) {
    document.getElementById('studentList').innerHTML = data.students.map((s, i) => `
      <div class="stat-row ${i===0?'podium-1':(i<3?'podium-2':'')}">
        <span>#${i+1} ${s.name} (${s.className})</span><span>${s.score} pt</span>
      </div>`).join('') || 'No records';

    const maxHouse = Math.max(...data.houses.map(h => h.score), 1);
    document.getElementById('houseList').innerHTML = data.houses.map((h, i) => `
      <div style="margin-bottom:12px;">
        <div style="display:flex; justify-content:space-between; font-weight:700;">
          <span>#${i+1} ${h.name}</span><span>${h.score} pt</span>
        </div>
        <div class="house-bar-container">
          <div class="house-bar bg-${h.name}" style="width:${(h.score/maxHouse)*100}%;"></div>
        </div>
      </div>`).join('');

    document.getElementById('groupList').innerHTML = data.groups.map(g => `<div class="stat-row"><span>${g.name}</span><span>${g.score}</span></div>`).join('');
    document.getElementById('classList').innerHTML = data.classes.map(c => `<div class="stat-row"><span>${c.name}</span><span>${c.score}</span></div>`).join('');
  }

  // Teacher Lookup
  function populateOptions(opts) {
    window.dropdownOpts = opts;
    updateLookupDropdown();
    document.getElementById('lookupType').addEventListener('change', updateLookupDropdown);
  }
  
  function updateLookupDropdown() {
    const type = document.getElementById('lookupType').value;
    const arr = type === 'class' ? window.dropdownOpts.classes : window.dropdownOpts.groups;
    document.getElementById('lookupValue').innerHTML = arr.map(a => `<option value="${a}">${a}</option>`).join('');
  }

  function lookupScores() {
    const type = document.getElementById('lookupType').value;
    const val = document.getElementById('lookupValue').value;
    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;
    
    document.getElementById('lookupResults').innerHTML = 'Loading...';
    document.getElementById('lookupResults').style.display = 'block';

    google.script.run.withSuccessHandler(res => {
      document.getElementById('lookupResults').innerHTML = res.map(r => `
        <div style="display:flex; justify-content:space-between; border-bottom:1px solid #000; padding:4px 0;">
          <span>${r.classNo}. ${r.name}</span><strong>${r.score}</strong>
        </div>
      `).join('');
    }).getStudentScoresByFilter(type, val, start, end);
  }
</script>
</body>
</html>
